plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Credentials for the self-hosted MotoRiderMaps API, which sits behind HTTP Basic
// over TLS. Read from local.properties (already gitignored) so no secret is ever
// committed, with a -P override for CI. Absent is a supported state and means "send
// no Authorization header" - which is what a local docker-compose stack, having no
// proxy in front of it, expects.
//
// Anything embedded in an APK is extractable by whoever holds the APK; this keeps
// credentials out of the repository, not out of the built app. Per-rider issuance is
// what makes that acceptable: a leaked credential is revoked by name.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def apiCredential = { String key ->
    def value = project.findProperty(key) ?: localProperties.getProperty(key) ?: ''
    // Escaped because the value is interpolated into a Java string literal below.
    return value.toString().replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace = 'com.motorider'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.motorider'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        // Same credential for both build types: it identifies the rider, not the
        // build. Set in local.properties:
        //   motoRiderApiUser=jon
        //   motoRiderApiPassword=...
        buildConfigField 'String', 'API_USERNAME', "\"${apiCredential('motoRiderApiUser')}\""
        buildConfigField 'String', 'API_PASSWORD', "\"${apiCredential('motoRiderApiPassword')}\""

        // The deployed server, for debug and release alike. There is one server the
        // app talks to, and which build type is being assembled says nothing about
        // where it should point.
        //
        // HTTPS is not decorative: the credential travels in an Authorization
        // header, and over plain HTTP anyone on the path could read it.
        //
        // The -P overrides exist for moving the server, not for day-to-day builds —
        // swapping the sslip.io hostname for a real domain is a change here or a
        // flag, and nothing else in the app depends on the name.
        buildConfigField 'String', 'ROUTING_API_BASE_URL',
                "\"${project.findProperty('motoRiderApiBase') ?: 'https://35.195.170.50.sslip.io'}\""
        buildConfigField 'String', 'TILE_SERVER_BASE_URL',
                "\"${project.findProperty('motoRiderTileBase') ?: 'https://35.195.170.50.sslip.io/styles/basic-preview'}\""
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            debuggable = true
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    packaging {
        resources {
            pickFirst('META-INF/NOTICE.md')
            pickFirst('META-INF/LICENSE.md')
        }
    }

    // Lets pure-logic classes that log be exercised on the JVM: android.util.Log
    // returns defaults instead of throwing "not mocked".
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation(platform('androidx.compose:compose-bom:2025.01.00'))
    implementation('androidx.compose.ui:ui')
    implementation('androidx.compose.ui:ui-graphics')
    implementation('androidx.compose.ui:ui-tooling-preview')
    implementation('androidx.compose.material3:material3')
    implementation('androidx.compose.material:material-icons-extended')
    implementation('androidx.activity:activity-compose:1.9.3')

    implementation('androidx.core:core-ktx:1.15.0')
    implementation('androidx.appcompat:appcompat:1.7.0')
    implementation('com.google.android.material:material:1.12.0')
    implementation('androidx.constraintlayout:constraintlayout:2.2.0')
    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.8.7')
    implementation('androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7')

    implementation('org.osmdroid:osmdroid-android:6.1.20')

    testImplementation('junit:junit:4.13.2')
    testImplementation('org.json:json:20231013')
    androidTestImplementation('androidx.test.ext:junit:1.1.5')
    androidTestImplementation('androidx.test:runner:1.5.2')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1')

    debugImplementation('androidx.compose.ui:ui-tooling')
    debugImplementation('androidx.compose.ui:ui-test-manifest')
}
