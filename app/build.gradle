plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.motorider'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.motorider'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            // Release builds must not point at a developer's LAN box. Override with
            // -PmotoRiderApiBase=https://... when a hosted API exists.
            buildConfigField 'String', 'ROUTING_API_BASE_URL',
                    "\"${project.findProperty('motoRiderApiBase') ?: 'https://api.motorider.invalid'}\""
        }
        debug {
            debuggable = true
            // 10.0.2.2 is the host loopback as seen from the Android emulator.
            // On a physical device set motoRiderDevApiBase to the host's LAN IP,
            // e.g. ./gradlew installDebug -PmotoRiderDevApiBase=http://192.168.68.52:8080
            buildConfigField 'String', 'ROUTING_API_BASE_URL',
                    "\"${project.findProperty('motoRiderDevApiBase') ?: 'http://10.0.2.2:8080'}\""
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    packaging {
        resources {
            pickFirst('META-INF/NOTICE.md')
            pickFirst('META-INF/LICENSE.md')
        }
    }
}

dependencies {
    implementation(platform('androidx.compose:compose-bom:2025.01.00'))
    implementation('androidx.compose.ui:ui')
    implementation('androidx.compose.ui:ui-graphics')
    implementation('androidx.compose.ui:ui-tooling-preview')
    implementation('androidx.compose.material3:material3')
    implementation('androidx.compose.material:material-icons-extended')
    implementation('androidx.activity:activity-compose:1.9.3')

    implementation('androidx.core:core-ktx:1.15.0')
    implementation('androidx.appcompat:appcompat:1.7.0')
    implementation('com.google.android.material:material:1.12.0')
    implementation('androidx.constraintlayout:constraintlayout:2.2.0')
    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.8.7')
    implementation('androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7')

    implementation('org.osmdroid:osmdroid-android:6.1.20')

    implementation('com.graphhopper:graphhopper-core:4.0')
    implementation('com.graphhopper:graphhopper-map-matching:4.0')

    testImplementation('junit:junit:4.13.2')
    testImplementation('org.json:json:20231013')
    androidTestImplementation('androidx.test.ext:junit:1.1.5')
    androidTestImplementation('androidx.test:runner:1.5.2')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1')

    debugImplementation('androidx.compose.ui:ui-tooling')
    debugImplementation('androidx.compose.ui:ui-test-manifest')
}
