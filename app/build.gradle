// App-level build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.motorider'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.motorider'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            debuggable = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            pickFirst('META-INF/NOTICE.md')
            pickFirst('META-INF/LICENSE.md')
        }
    }
}

dependencies {
    implementation('androidx.appcompat:appcompat:1.6.1')
    implementation('com.google.android.material:material:1.12.0')
    implementation('androidx.constraintlayout:constraintlayout:2.1.4')
    
    // OpenStreetMap dependency (latest stable version)
    implementation('org.osmdroid:osmdroid-android:6.1.20')
    
    // For routing (using GraphHopper as example)
    implementation('com.graphhopper:graphhopper-core:4.0')
    implementation('com.graphhopper:graphhopper-map-matching:4.0')
    
    // Test dependencies
    testImplementation('junit:junit:4.13.2')
    androidTestImplementation('androidx.test.ext:junit:1.1.5')
    androidTestImplementation('androidx.test:runner:1.5.2')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.5.1')
}
